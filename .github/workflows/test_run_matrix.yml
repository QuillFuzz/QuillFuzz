name: Run Test Runs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from repository secrets
        run: |
          cat > .env <<EOF
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          EOF
        shell: bash

      - name: Build Docker image and start container (non-root)
        run: |
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)
          UID=$HOST_UID GID=$HOST_GID docker compose up -d --build
        shell: bash

      - name: Run Guppy test
        run: >
          docker compose run --rm
          -e PYTHONPATH=/QuillFuzz/src
          quillfuzz
          python src/gen_w_improve.py
          --config_file run_configs/guppy_test_run_config.yaml
          --run_name ci_test_guppy

      - name: Run Pytket test
        run: >
          docker compose run --rm
          -e PYTHONPATH=/QuillFuzz/src
          quillfuzz
          python src/gen_w_improve.py
          --config_file run_configs/pytket_test_run_config.yaml
          --run_name ci_test_pytket

      - name: Run Qiskit test
        run: >
          docker compose run --rm
          -e PYTHONPATH=/QuillFuzz/src
          quillfuzz
          python src/gen_w_improve.py
          --config_file run_configs/qiskit_test_run_config.yaml
          --run_name ci_test_qiskit
