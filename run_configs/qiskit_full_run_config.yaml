language: qiskit
models:
  - deepseek/deepseek-chat
  # - deepseek/deepseek-reasoner
  # - anthropic/claude-sonnet-4-5
  
n_programs: 5
n_fixing_cycles: 2
max_workers: 10
n_assemble: 1
