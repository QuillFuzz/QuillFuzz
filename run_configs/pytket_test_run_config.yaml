language: pytket
models:
  - deepseek/deepseek-v4-flash
  - anthropic/claude-haiku-4-5
  - openai/gpt-5-mini
  - openai/gpt-5.4-nano

n_programs: 20
n_fixing_cycles: 2
# Enable the mutation stage after generation
enable_mutation: true
# Number of mutation candidates to produce when mutation is enabled
n_mutations: 20
# Maximum number of fixing cycles to perform for each mutation
mutation_fix_cycles: 1
max_workers: 10
n_assemble: 2
n_circuits_per_assembly: 2
verbose: false
reasoning_effort: high
ks_low_threshold: 0.001

# Improvement loop parameters for improving prompt before mass generation
improve_prompt: false
improver_model: deepseek/deepseek-v4-pro
training_n: 2
max_rounds: 1
