# Language of testing
language: guppy
# LLM models to use for generation of quantum programs
models:
  - deepseek/deepseek-v4-flash
  - anthropic/claude-haiku-4-5
  - openai/gpt-5-mini
  - openai/gpt-5.4-nano

# Number of programs to generate for each model
n_programs: 20
# Maximum number of fixing cycles to perform for each generated program
n_fixing_cycles: 3
# Enable the mutation stage after generation
enable_mutation: true
# Number of mutation candidates to produce when mutation is enabled
n_mutations: 20
# Maximum number of fixing cycles to perform for each mutation
mutation_fix_cycles: 1
# Number of parallel workers to use for generation and fixing
max_workers: 10
# Number of assembled programs to make for each model
n_assemble: 2
# Maximum number of sub-programs per assembled program
n_circuits_per_assembly: 2
# Prints executed code for easier debugging. Warning: this will produce a lot of output
verbose: false
# Reasoning effort of model to generate program
reasoning_effort: high
# Threshold for KS test to detect miscompilation.
ks_low_threshold: 0.001


# Improvement loop parameters for improving prompt before mass generation
improve_prompt: false
improver_model: deepseek/deepseek-v4-pro
