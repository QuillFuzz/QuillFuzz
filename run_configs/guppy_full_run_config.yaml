# Language of testing
language: guppy
# LLM models to use for generation of quantum programs
models:
  # - anthropic/claude-sonnet-4-5 
  - openai/gpt-5-mini 
  - openai/gpt-5.4-nano
  # - gemini/gemini-3-pro-preview 
# Number of programs to generate for each model
n_programs: 20
# Maximum number of fixing cycles to perform for each generated program
n_fixing_cycles: 2
# Number of parallel workers to use for generation and fixing
max_workers: 10
# Number of assembled programs to make for each model
n_assemble: 1
# Maximum number of sub-programs per assembled program
n_circuits_per_assembly: 1
# Prints executed code for easier debugging. Warning: this will produce a lot of output
verbose: false

# Improvement loop parameters for improving prompt before mass generation
improve_prompt: false
improver_model: gemini/gemini-3.1-pro-preview
reasoning_effort: medium
