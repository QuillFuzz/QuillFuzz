services:
  quillfuzz:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Mount current directory to /QuillFuzz inside container
      - .:/QuillFuzz
    # Keep the container running
    command: tail -f /dev/null
    environment:
        # Pass through any needed env vars here
        - RUST_BACKTRACE=1
